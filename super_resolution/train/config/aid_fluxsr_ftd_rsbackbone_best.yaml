# AID x4 FluxSR using the remote-sensing-pretrained FLUX transformer.
# The base FLUX pipeline still supplies the VAE, tokenizers and text encoders.
flux_path: "../assets/models/flux"
transformer_path: "../assets/models/sr-transformer"
dtype: "bfloat16"

model:
  max_sequence_length: 256

fluxsr:
  t_l: 0.4
  guidance_scale: 3.5

  # Best fidelity-oriented recipe from the previous three-stage tuning.
  ftd_weight: 0.25
  mse_weight: 10.0
  l1_weight: 1.0
  y_mse_weight: 10.0
  y_l1_weight: 1.0
  ssim_weight: 0.5
  ssim_border: 4
  lpips_weight: 0.02
  tv_lpips_gamma: 0.1
  adl_weight: 0.0

train:
  stage: "rsbackbone-best-fidelity"
  require_init_lora: false
  init_lora_path: null
  run_name_prefix: "aid-fluxsr-rsbackbone-best"

  max_steps: 20000
  save_interval: 2000
  log_interval: 10
  sample_count: 4

  # Physical GPUs 0 and 1 are exposed by the launcher. Batch 2 per GPU keeps
  # the effective global batch at 4 without gradient-accumulation overhead.
  devices: 2
  strategy: "ddp_find_unused_parameters_false"
  batch_size: 2
  accumulate_grad_batches: 1
  dataloader_workers: 8
  prefetch_factor: 4
  precision: "bf16-mixed"
  gradient_checkpointing: false
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: "high"
  gradient_clip_val: 1.0
  save_path: "runs/aid_fluxsr_ftd_rsbackbone_best"

  dataset:
    root: "../assets/datasets/aid"
    train_splits: ["train"]
    preview_splits: ["test"]
    lr_size: 128
    hr_size: 512
    random_flip: true

  lora_config:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    init_lora_weights: "gaussian"
    # Replaced with FLUXSR_LORA_TARGET_MODULES by the training entry point.
    target_modules: ".*x_embedder"

  optimizer:
    type: "AdamW"
    params:
      lr: 0.00002
      betas: [0.9, 0.999]
      eps: 0.00000001
      weight_decay: 0.01
      fused: false
    scheduler:
      type: "CosineAnnealingLR"
      params:
        T_max: 20000
        eta_min: 0.0000005

  swanlab:
    project: "AID-FluxSR-FTD"
