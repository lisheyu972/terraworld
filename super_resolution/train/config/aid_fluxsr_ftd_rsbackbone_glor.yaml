# GLoR-enhanced one-step AID x4 super-resolution.
# FLUX.1-dev supplies VAE/text components; only its transformer is replaced.
flux_path: "../assets/models/flux"
transformer_path: "../assets/models/sr-transformer"
dtype: "bfloat16"

model:
  max_sequence_length: 256

# GLoR is injected only into the generated latent branch. There is no
# additional OminiControl image-condition branch in this FluxSR formulation.
glor_control:
  enable: true
  task: "super_resolution"
  disable_omini_condition: true
  ctrl_dim: 512
  fusion_dim: 1024

  # Sparse middle/late injection: standard FLUX has 19 dual and 38 single
  # blocks. Six sites retain multi-depth control without 39 repeated injections.
  inject_dual_indices: [6, 12, 18]
  inject_single_indices: [12, 24, 36]
  alpha_init: 0.001

  global_memory:
    pool_size: 4
  local_retrieval:
    sr_patch_size: 3
  tasks:
    super_resolution:
      use_scale_embedding: true
      in_channels: 5
      feature_mode: "rgb_y_edge"

fluxsr:
  t_l: 0.4
  guidance_scale: 3.5

  # Best Y-fidelity recipe retained from the remote-sensing-backbone run.
  ftd_weight: 0.25
  mse_weight: 10.0
  l1_weight: 1.0
  y_mse_weight: 10.0
  y_l1_weight: 1.0
  ssim_weight: 0.5
  ssim_border: 4
  lpips_weight: 0.02
  tv_lpips_gamma: 0.1
  adl_weight: 0.0

train:
  stage: "rsbackbone-glor-20k"
  require_init_lora: false
  init_lora_path: null
  run_name_prefix: "aid-fluxsr-rsbackbone-glor-20k"

  # Fair ablation against the previous 20K remote-backbone FluxSR run:
  # both runs start a new rank-16 LoRA from the same transformer.
  max_steps: 20000
  save_interval: 2000
  log_interval: 10
  sample_count: 4

  devices: 2
  strategy: "ddp_find_unused_parameters_false"
  batch_size: 2
  accumulate_grad_batches: 1
  dataloader_workers: 8
  prefetch_factor: 4
  precision: "bf16-mixed"

  # GLoR caches observation K/V inside one training step. Keep recomputation
  # disabled for both correctness of that cache and higher two-GPU throughput.
  gradient_checkpointing: false
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: "high"
  gradient_clip_val: 1.0
  save_path: "runs/aid_fluxsr_ftd_rsbackbone_glor_20k"

  dataset:
    root: "../assets/datasets/aid"
    train_splits: ["train"]
    preview_splits: ["test"]
    lr_size: 128
    hr_size: 512
    random_flip: true

  lora_config:
    r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    init_lora_weights: "gaussian"
    target_modules: ".*x_embedder"

  optimizer:
    type: "AdamW"
    params:
      # Same optimizer and LR as the no-GLoR 20K comparison run. LoRA and
      # GLoR share one LR so the only method change is the added GLoR module.
      lr: 0.00002
      betas: [0.9, 0.999]
      eps: 0.00000001
      weight_decay: 0.01
      fused: false
    scheduler:
      type: "CosineAnnealingLR"
      params:
        T_max: 20000
        eta_min: 0.0000005

  swanlab:
    project: "AID-FluxSR-GLoR"
